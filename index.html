<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CASTOR</title>
<style>
:root{--bg:#263d60;--bg2:#172b49;--text:#fff;--muted:rgba(255,255,255,.68);--line:rgba(255,255,255,.18);--accent:#b9d2f4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg2);color:#fff;font-family:Arial,"Helvetica Neue",sans-serif}
a{text-decoration:none;color:inherit}
.wrap{width:calc(100% - 140px);margin:auto}

/* Header */
.header{position:fixed;top:0;left:0;right:0;z-index:50;height:86px;display:flex;align-items:center;background:transparent;backdrop-filter:none}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.home-logo{display:block;width:150px;transition:opacity .25s,transform .25s}
.home-logo:hover{opacity:.78;transform:translateY(-1px)}
.home-logo img{display:block;width:100%;height:auto;filter:brightness(0) invert(1)}
.nav{display:flex;align-items:center;gap:42px;font-size:13px;letter-spacing:.14em;font-weight:700}
.nav a{position:relative;padding:10px 0;color:rgba(255,255,255,.82)}
.nav a:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:#fff;transform:scaleX(0);transform-origin:right;transition:transform .3s}
.nav a:hover:after{transform:scaleX(1);transform-origin:left}

/* HERO */
.hero{
  position:relative;
  min-height:100svh;
  margin-top:0;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:#263d60 url("assets/hero-bg.png") center/cover no-repeat;
}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(210,227,249,.18),transparent 35%)}
.hero-mark{position:absolute;width:min(72vw,900px);opacity:.2;animation:markIn 2.2s ease-out .2s both}
.hero-logo{position:relative;width:min(60vw,700px);filter:drop-shadow(0 0 20px rgba(255,255,255,.24));animation:logoIn 2s ease-out 1s both;clip-path:inset(0 100% 0 0)}
.hero-copy{position:absolute;left:0;right:0;bottom:12%;text-align:center;letter-spacing:.18em;font-size:14px;color:rgba(255,255,255,.8);animation:copyIn 1.2s ease-out 2.2s both}
.hero-copy strong{display:block;font-size:clamp(20px,3vw,34px);letter-spacing:.28em;margin-bottom:10px;color:#fff}
.hero-copy span{font-size:11px;letter-spacing:.24em}

@keyframes markIn{
  0%{opacity:0;transform:scale(.94);filter:blur(12px)}
  100%{opacity:.2;transform:scale(1);filter:blur(.2px)}
}
@keyframes logoIn{
  0%{clip-path:inset(0 100% 0 0);filter:blur(8px) drop-shadow(0 0 0 rgba(255,255,255,0))}
  100%{clip-path:inset(0 0 0 0);filter:blur(0) drop-shadow(0 0 20px rgba(255,255,255,.24))}
}

.shooting-star{
  position:absolute;
  width:clamp(110px,14vw,190px);
  height:1px;
  left:50%;
  top:39%;
  transform:translateX(-155px);
  opacity:0;
  filter:drop-shadow(0 0 4px rgba(255,255,255,.22));
  animation:starPass 2.4s ease-in-out 1.0s forwards;
  z-index:2;
  pointer-events:none;
}
.shooting-star:before{
  content:"";
  position:absolute;
  right:-4px;
  top:50%;
  width:5px;
  height:5px;
  transform:translateY(-50%) rotate(45deg);
  background:rgba(255,255,255,.82);
  box-shadow:0 0 7px rgba(255,255,255,.42);
}
.shooting-star:after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:1px;
  background:linear-gradient(
    to left,
    rgba(255,255,255,.58),
    rgba(255,255,255,.22) 45%,
    transparent
  );
}
@keyframes starPass{
  0%{
    opacity:0;
    transform:translateX(-155px);
  }
  18%{
    opacity:.48;
  }
  58%{
    opacity:.38;
    transform:translateX(45px);
  }
  100%{
    opacity:0;
    transform:translateX(85px);
  }
}

@keyframes copyIn{
  0%{opacity:0;transform:translateY(12px)}
  100%{opacity:1;transform:none}
}

/* SITE SKELETON */
.section{min-height:72vh;padding:120px 0;display:flex;align-items:center;border-top:1px solid var(--line)}
.section.play{background:#1b304f}
.section.create{background:#223958}
.section-inner{width:100%}
.section-label{font-size:11px;letter-spacing:.28em;color:var(--accent);margin-bottom:22px}
.section h2{font-size:clamp(48px,9vw,120px);font-weight:300;letter-spacing:.06em;margin:0 0 28px}
.section p{max-width:620px;color:var(--muted);line-height:2;font-size:15px}
.placeholder{margin-top:55px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 0;display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.55);font-size:12px;letter-spacing:.18em}
.placeholder b{color:#fff;font-size:13px}


/* PLAY / HBK GAMING */
.play{
  min-height:100vh;
  background:
    radial-gradient(circle at 78% 20%,rgba(184,208,244,.10),transparent 28%),
    #1b304f;
}
.play-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:60px;
  margin-bottom:52px;
}
.play h2{margin-bottom:18px}
.play-intro{
  margin:0;
  max-width:520px;
  color:rgba(255,255,255,.68);
  line-height:1.9;
  font-size:14px;
}
.hbk-logo{
  width:clamp(110px,13vw,170px);
  height:auto;
  object-fit:contain;
  opacity:.94;
  filter:drop-shadow(0 8px 22px rgba(0,0,0,.22));
}
.team-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.team-card{
  min-width:0;
}
.team-photo{
  height:clamp(300px,34vw,470px);
  overflow:hidden;
  position:relative;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
}
.team-photo:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(10,24,43,.26),transparent 35%);
  pointer-events:none;
}
.team-photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
  display:block;
  transition:transform .5s ease;
}
.team-card:hover .team-photo img{transform:scale(1.025)}
.team-meta{
  padding:11px 0 0;
  border-bottom:1px solid rgba(255,255,255,.16);
  padding-bottom:14px;
}
.team-meta span{
  display:block;
  width:max-content;
  max-width:100%;
  padding:4px 8px;
  background:rgba(255,255,255,.12);
  color:rgba(255,255,255,.72);
  font-size:9px;
  letter-spacing:.16em;
  margin-bottom:7px;
}
.team-meta strong{
  display:block;
  font-size:14px;
  letter-spacing:.06em;
  font-weight:600;
}
.play-footer{
  margin-top:28px;
  padding-top:16px;
  border-top:1px solid rgba(255,255,255,.14);
  display:flex;
  justify-content:space-between;
  color:rgba(255,255,255,.42);
  font-size:10px;
  letter-spacing:.18em;
}

/* FOOTER */
.footer{padding:55px 0;background:#13253e;border-top:1px solid var(--line)}
.footer-inner{display:flex;justify-content:space-between;gap:30px;color:rgba(255,255,255,.5);font-size:11px;letter-spacing:.12em}
.footer-logo{width:120px}
.footer-logo img{width:100%;filter:brightness(0) invert(1)}


@media(max-width:700px){
  .play-head{
    align-items:flex-start;
    flex-direction:column;
    gap:25px;
    margin-bottom:34px;
  }
  .hbk-logo{width:105px}
  .team-grid{grid-template-columns:1fr;gap:24px}
  .team-photo{height:430px}
  .play-footer{font-size:9px}

  .wrap{width:calc(100% - 34px)}
  .header{height:72px}
  .home-logo{width:118px}
  .nav{gap:20px;font-size:11px}
  .hero-logo{width:82vw}
  .hero-mark{width:72vw}
  .hero-copy{bottom:10%;padding:0 20px}
  .section{min-height:65vh;padding:90px 0}
  .section h2{font-size:54px}
  .placeholder{display:block}
  .placeholder b{display:block;margin-bottom:8px}
  .footer-inner{display:block}
  .footer-logo{margin-bottom:24px}
}
</style>
</head>
<body>

<header class="header">
  <div class="wrap header-inner">
    <a class="home-logo" href="#top" aria-label="CASTOR Home">
      <img src="assets/castor-logo-official-1.png" alt="CASTOR">
    </a>
    <nav class="nav" aria-label="Main navigation">
      <a href="#play">PLAY</a>
      <a href="#create">CREATE</a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero" aria-label="CASTOR hero">
    <div class="shooting-star" aria-hidden="true"></div>
    <img class="hero-mark" src="assets/castor-mark.png" alt="">
    <img class="hero-logo" src="assets/castor-logo-official-1.png" alt="CASTOR">
</section>

  <section class="section play" id="play">
  <div class="wrap section-inner">
    <div class="play-head">
      <div>
        <div class="section-label">01 / PLAY</div>
        <h2>PLAY</h2>
        <p class="play-intro">CASTORのPLAY。<br>ゲームを中心に、遊ぶことから生まれるものを。</p>
      </div>
      <img class="hbk-logo" src="assets/hbk-gaming-logo.png" alt="HBK GAMING">
    </div>

    <div class="team-grid">
      <article class="team-card">
        <div class="team-photo"><img src="assets/hbk-kairi.png" alt="kairi"></div>
        <div class="team-meta">
          <span>HBK GAMING</span>
          <strong>kairi</strong>
        </div>
      </article>

      <article class="team-card">
        <div class="team-photo"><img src="assets/hbk-kappa.png" alt="kappa"></div>
        <div class="team-meta">
          <span>HBK GAMING</span>
          <strong>kappa</strong>
        </div>
      </article>

      <article class="team-card">
        <div class="team-photo"><img src="assets/hbk-sota.png" alt="sota"></div>
        <div class="team-meta">
          <span>HBK GAMING</span>
          <strong>sota</strong>
        </div>
      </article>
    </div>

    <div class="play-footer">
      <span>HBK GAMING</span>
      <span>PLAY / GAMING</span>
    </div>
  </div>
</section>

  <section class="section create" id="create">
    <div class="wrap section-inner">
      <div class="section-label">02 / CREATE</div>
      <h2>CREATE</h2>
      <p>ここにCASTORの「CREATE」を入れていきます。ゲーム制作、Web、映像など、つくったものをまとめる場所。</p>
      <div class="placeholder">
        <b>PROJECTS / CREATE</b>
        <span>CONTENTS WILL BE ADDED</span>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <div class="footer-logo">
      <img src="assets/castor-logo-official-1.png" alt="CASTOR">
    </div>
    <div>© CASTOR</div>
  </div>
</footer>

</body>
</html>
