<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CASTOR</title>
<style>
:root{--bg:#263d60;--bg2:#172b49;--text:#fff;--muted:rgba(255,255,255,.68);--line:rgba(255,255,255,.18);--accent:#b9d2f4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg2);color:#fff;font-family:Arial,"Helvetica Neue",sans-serif}
a{text-decoration:none;color:inherit}
.wrap{width:calc(100% - 140px);margin:auto}

/* Header */
.header{position:fixed;top:0;left:0;right:0;z-index:50;height:86px;display:flex;align-items:center;background:transparent;backdrop-filter:none}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.home-logo{display:block;width:150px;transition:opacity .25s,transform .25s}
.home-logo:hover{opacity:.78;transform:translateY(-1px)}
.home-logo img{display:block;width:100%;height:auto;filter:brightness(0) invert(1)}
.nav{display:flex;align-items:center;gap:42px;font-size:13px;letter-spacing:.14em;font-weight:700}
.nav a{position:relative;padding:10px 0;color:rgba(255,255,255,.82)}
.nav a:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:#fff;transform:scaleX(0);transform-origin:right;transition:transform .3s}
.nav a:hover:after{transform:scaleX(1);transform-origin:left}

/* HERO */
.hero{
  position:relative;
  min-height:100svh;
  margin-top:0;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:#263d60 url("assets/hero-bg.png") center/cover no-repeat;
}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(210,227,249,.18),transparent 35%)}
.hero-mark{position:absolute;width:min(72vw,900px);opacity:.2;animation:markIn 2.2s ease-out .2s both}
.hero-logo{position:relative;width:min(60vw,700px);filter:drop-shadow(0 0 20px rgba(255,255,255,.24));animation:logoIn 2s ease-out 1s both;}

@keyframes markIn{
  0%{opacity:0;transform:scale(.94);filter:blur(12px)}
  100%{opacity:.2;transform:scale(1);filter:blur(.2px)}
}
@keyframes logoIn{
  0%{opacity:0;transform:translateY(4px);filter:blur(8px) drop-shadow(0 0 0 rgba(255,255,255,0))}
  100%{opacity:1;transform:translateY(0);filter:blur(0) drop-shadow(0 0 20px rgba(255,255,255,.24))}
}

.shooting-star{
  position:absolute;
  width:clamp(110px,14vw,190px);
  height:1px;
  left:50%;
  top:39%;
  transform:translateX(-155px);
  opacity:0;
  filter:drop-shadow(0 0 4px rgba(255,255,255,.22));
  animation:starPass 2.4s ease-in-out 1.0s forwards;
  z-index:2;
  pointer-events:none;
}
.shooting-star:before{
  content:"";
  position:absolute;
  right:-4px;
  top:50%;
  width:5px;
  height:5px;
  transform:translateY(-50%) rotate(45deg);
  background:rgba(255,255,255,.82);
  box-shadow:0 0 7px rgba(255,255,255,.42);
}
.shooting-star:after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:1px;
  background:linear-gradient(to left,rgba(255,255,255,.58),rgba(255,255,255,.22) 45%,transparent);
}
@keyframes starPass{
  0%{opacity:0;transform:translateX(-155px)}
  18%{opacity:.48}
  58%{opacity:.38;transform:translateX(45px)}
  100%{opacity:0;transform:translateX(85px)}
}

/* SITE SKELETON */
.section{min-height:72vh;padding:120px 0;display:flex;align-items:center;border-top:1px solid var(--line)}
.section.play{background:#1b304f}
.section.create{background:#223958}
.section-inner{width:100%}
.section-label{font-size:11px;letter-spacing:.28em;color:var(--accent);margin-bottom:22px}
.section h2{font-size:clamp(48px,9vw,120px);font-weight:300;letter-spacing:.06em;margin:0 0 28px}
.section p{max-width:620px;color:var(--muted);line-height:2;font-size:15px}

/* PLAY / HBK GAMING */
.play{
  min-height:100vh;
  background:
    radial-gradient(circle at 78% 20%,rgba(184,208,244,.10),transparent 28%),
    #1b304f;
}
.play-head{display:flex;justify-content:space-between;align-items:flex-end;gap:60px;margin-bottom:52px}
.play h2{margin-bottom:18px}
.play-intro{margin:0;max-width:520px;color:rgba(255,255,255,.68);line-height:1.9;font-size:14px}
.hbk-logo{width:clamp(110px,13vw,170px);height:auto;object-fit:contain;opacity:.94;filter:drop-shadow(0 8px 22px rgba(0,0,0,.22))}
.team-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.team-card{min-width:0}
.team-card-link{position:relative;display:block;color:inherit;outline:none}
.card-trace{position:absolute;inset:-1px;z-index:4;overflow:visible;pointer-events:none}
.card-trace svg{display:block;width:100%;height:100%;overflow:visible}
.card-trace rect{fill:none;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:24 76;stroke-dashoffset:100;opacity:0}
.team-card-link:hover .card-trace rect,
.team-card-link:focus-visible .card-trace rect{opacity:.95;animation:cardTrace 1.55s linear infinite}
.team-card-link:focus-visible{outline:1px solid rgba(255,255,255,.65);outline-offset:5px}
@keyframes cardTrace{to{stroke-dashoffset:0}}
.team-photo{height:clamp(300px,34vw,470px);overflow:hidden;position:relative;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.team-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,24,43,.26),transparent 35%);pointer-events:none}
.team-photo img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;transition:transform .5s ease}
.team-card:hover .team-photo img{transform:scale(1.025)}
.team-meta{padding:11px 0 0;border-bottom:1px solid rgba(255,255,255,.16);padding-bottom:14px}
.team-meta span{display:block;width:max-content;max-width:100%;padding:4px 8px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.72);font-size:9px;letter-spacing:.16em;margin-bottom:7px}
.team-meta strong{display:block;font-size:14px;letter-spacing:.06em;font-weight:600}
.play-footer{margin-top:28px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;color:rgba(255,255,255,.42);font-size:10px;letter-spacing:.18em}

/* CREATE */
.create{
  min-height:78vh;
  background:
    radial-gradient(circle at 78% 28%,rgba(184,208,244,.09),transparent 30%),
    #223958;
}
.create-content{display:grid;grid-template-columns:1fr 1.1fr;gap:70px;align-items:center}
.create-copy p{margin-top:0}
.studio-card{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  min-height:280px;
  padding:36px 42px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.045);
  transition:transform .35s ease,border-color .35s ease,background .35s ease;
  overflow:hidden;
}
.studio-card:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.07) 50%,transparent 80%);
  transform:translateX(-110%);
  transition:transform .8s ease;
}
.studio-card:hover{
  transform:translateY(-3px);
  border-color:rgba(255,255,255,.52);
  background:rgba(255,255,255,.07);
}
.studio-card:hover:before{transform:translateX(110%)}
.studio-card img{
  position:relative;
  z-index:1;
  width:min(100%,360px);
  max-height:105px;
  object-fit:contain;
  object-position:left center;
  display:block;
  filter:brightness(0) invert(1);
}
.studio-card span{
  position:relative;
  z-index:1;
  margin-top:30px;
  font-size:10px;
  font-weight:700;
  letter-spacing:.2em;
  color:rgba(255,255,255,.68);
}
.studio-card:hover span{color:#fff}

/* FOOTER */
.footer{padding:55px 0;background:#13253e;border-top:1px solid var(--line)}
.footer-inner{display:flex;justify-content:space-between;gap:30px;color:rgba(255,255,255,.5);font-size:11px;letter-spacing:.12em}
.footer-logo{width:120px}
.footer-logo img{width:100%;filter:brightness(0) invert(1)}

@media(max-width:900px){
  .create-content{grid-template-columns:1fr;gap:40px}
  .studio-card{min-height:220px}
}
@media(max-width:700px){
  .play-head{align-items:flex-start;flex-direction:column;gap:25px;margin-bottom:34px}
  .hbk-logo{width:105px}
  .team-grid{grid-template-columns:1fr;gap:24px}
  .team-photo{height:430px}
  .play-footer{font-size:9px}
  .wrap{width:calc(100% - 34px)}
  .header{height:72px}
  .home-logo{width:118px}
  .nav{gap:20px;font-size:11px}
  .hero-logo{width:82vw}
  .hero-mark{width:72vw}
  .section{min-height:65vh;padding:90px 0}
  .section h2{font-size:54px}
  .studio-card{padding:28px}
  .studio-card img{width:min(100%,300px)}
  .footer-inner{display:block}
  .footer-logo{margin-bottom:24px}
}

@media (max-width:520px){
  .hero-logo{
    clip-path:none!important;
    -webkit-clip-path:none!important;
    animation:logoIn 2s ease-out 1s both!important;
    opacity:0;
    transform:translateY(4px);
    filter:drop-shadow(0 0 20px rgba(255,255,255,.24))!important;
    will-change:opacity,transform,filter;
  }
}

/* CASTOR ambient motion — CSS only */
.section.play,.section.create{position:relative;overflow:hidden}
.section.play>.wrap,.section.create>.wrap{position:relative;z-index:2}
.section.play::before{content:"";position:absolute;width:55vw;height:55vw;max-width:850px;max-height:850px;left:-18vw;top:8%;border-radius:50%;background:radial-gradient(circle,rgba(190,216,248,.12),rgba(190,216,248,.055) 24%,transparent 68%);filter:blur(10px);animation:playLight 18s ease-in-out infinite alternate;pointer-events:none}
.section.play::after{content:"";position:absolute;width:42vw;height:42vw;max-width:650px;max-height:650px;right:-15vw;bottom:-18%;border-radius:50%;background:radial-gradient(circle,rgba(160,198,241,.07),transparent 68%);filter:blur(12px);animation:playLight2 22s ease-in-out infinite alternate;pointer-events:none}
@keyframes playLight{from{transform:translate3d(0,0,0) scale(.92)}to{transform:translate3d(30vw,8vh,0) scale(1.12)}}
@keyframes playLight2{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-18vw,-8vh,0) scale(1.16)}}
.team-card-link::after{content:"";position:absolute;z-index:3;top:0;left:-55%;width:35%;height:100%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.045),transparent);transform:skewX(-14deg);animation:cardSweep 11s ease-in-out infinite}
.team-card:nth-child(2) .team-card-link::after{animation-delay:3.5s}.team-card:nth-child(3) .team-card-link::after{animation-delay:7s}
@keyframes cardSweep{0%,62%{left:-55%;opacity:0}70%{opacity:1}88%,100%{left:120%;opacity:0}}
.section.create::before,.section.create::after{content:"";position:absolute;left:68%;top:48%;width:18vw;height:18vw;max-width:300px;max-height:300px;border:1px solid rgba(190,216,248,.055);border-radius:50%;transform:translate(-50%,-50%) scale(.35);opacity:0;pointer-events:none;animation:createRipple 9s ease-out infinite}
.section.create::after{animation-delay:4.5s}
@keyframes createRipple{0%{transform:translate(-50%,-50%) scale(.35);opacity:0}12%{opacity:.8}75%{opacity:.18}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
.create-content::after{content:"";position:absolute;width:32vw;height:32vw;max-width:480px;max-height:480px;right:-8vw;top:-12vw;border-radius:50%;background:radial-gradient(circle,rgba(190,216,248,.055),transparent 68%);filter:blur(8px);animation:createAmbient 16s ease-in-out infinite alternate;pointer-events:none}
@keyframes createAmbient{from{transform:translate3d(0,0,0) scale(.94)}to{transform:translate3d(-12vw,10vh,0) scale(1.1)}}
@media(prefers-reduced-motion:reduce){.section.play::before,.section.play::after,.team-card-link::after,.section.create::before,.section.create::after,.create-content::after{animation:none!important}}
@media(max-width:700px){.section.play::before{width:85vw;height:85vw;left:-35vw}.section.play::after{width:70vw;height:70vw;right:-28vw}.section.create::before,.section.create::after{left:72%;top:42%;width:30vw;height:30vw}.create-content::after{width:55vw;height:55vw;right:-18vw;top:-8vw}.team-card-link::after{animation-duration:14s}}

</style>
</head>
<body>

<header class="header">
  <div class="wrap header-inner">
    <a class="home-logo" href="#top" aria-label="CASTOR Home">
      <img src="assets/castor-logo-official-1.png" alt="CASTOR">
    </a>
    <nav class="nav" aria-label="Main navigation">
      <a href="#play">PLAY</a>
      <a href="#create">CREATE</a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero" aria-label="CASTOR hero">
    <div class="shooting-star" aria-hidden="true"></div>
    <img class="hero-mark" src="assets/castor-mark.png" alt="">
    <img class="hero-logo" src="assets/castor-logo-official-1.png" alt="CASTOR">
  </section>

  <section class="section play" id="play">
    <div class="wrap section-inner">
      <div class="play-head">
        <div>
          <div class="section-label">01 / PLAY</div>
          <h2>PLAY</h2>
          <p class="play-intro">CASTORのPLAY。<br>ゲームを中心に、遊ぶことから生まれるものを。</p>
        </div>
        <img class="hbk-logo" src="assets/hbk-gaming-logo.png" alt="HBK GAMING">
      </div>

      <div class="team-grid">
        <article class="team-card">
          <a class="team-card-link" href="kairi.html" aria-label="kairiのページを見る">
            <span class="card-trace" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><rect x=".5" y=".5" width="99" height="99" pathLength="100"/></svg></span>
            <div class="team-photo"><img src="assets/hbk-kairi.png" alt="kairi"></div>
            <div class="team-meta"><span>HBK GAMING</span><strong>kairi</strong></div>
          </a>
        </article>

        <article class="team-card">
          <a class="team-card-link" href="kappa.html" aria-label="kappaのページを見る">
            <span class="card-trace" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><rect x=".5" y=".5" width="99" height="99" pathLength="100"/></svg></span>
            <div class="team-photo"><img src="assets/hbk-kappa.png" alt="kappa"></div>
            <div class="team-meta"><span>HBK GAMING</span><strong>kappa</strong></div>
          </a>
        </article>

        <article class="team-card">
          <a class="team-card-link" href="sota.html" aria-label="sotaのページを見る">
            <span class="card-trace" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><rect x=".5" y=".5" width="99" height="99" pathLength="100"/></svg></span>
            <div class="team-photo"><img src="assets/hbk-sota.png" alt="sota"></div>
            <div class="team-meta"><span>HBK GAMING</span><strong>sota</strong></div>
          </a>
        </article>
      </div>

      <div class="play-footer">
        <span>HBK GAMING</span>
        <span>PLAY / GAMING</span>
      </div>
    </div>
  </section>

  <section class="section create" id="create">
    <div class="wrap section-inner">
      <div class="create-content">
        <div class="create-copy">
          <div class="section-label">02 / CREATE</div>
          <h2>CREATE</h2>
          <p>CASTORの「CREATE」。<br>ゲームやWebなど、つくってみたいものを形にしていく場所。</p>
        </div>

        <a class="studio-card" href="kairi-studio.html" aria-label="KAIRI_studioのページを見る">
          <img src="assets/kairi-studio-logo.png" alt="KAIRI_studio">
          <span>VIEW KAIRI_STUDIO →</span>
        </a>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <div class="footer-logo">
      <img src="assets/castor-logo-official-1.png" alt="CASTOR">
    </div>
    <div>© CASTOR</div>
  </div>
</footer>

</body>
</html>
