<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAIRI_studio | CASTOR</title>
<style>
:root{--bg:#263d60;--bg2:#172b49;--muted:rgba(255,255,255,.68);--line:rgba(255,255,255,.18);--accent:#b9d2f4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100%;background:var(--bg2);color:#fff;font-family:Arial,"Helvetica Neue",sans-serif}
a{text-decoration:none;color:inherit}
.wrap{width:calc(100% - 140px);max-width:1500px;margin:auto}
.header{position:fixed;top:0;left:0;right:0;z-index:50;height:86px;display:flex;align-items:center}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.home-logo{display:block;width:150px}
.home-logo img{display:block;width:100%;height:auto;filter:brightness(0) invert(1)}
.nav{display:flex;align-items:center;gap:42px;font-size:13px;letter-spacing:.14em;font-weight:700}
.nav a{position:relative;padding:10px 0;color:rgba(255,255,255,.82)}
.nav a:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:#fff;transform:scaleX(0);transform-origin:right;transition:transform .3s}
.nav a:hover:after{transform:scaleX(1);transform-origin:left}

.studio-hero{
  position:relative;min-height:100svh;overflow:hidden;
  background:
    radial-gradient(circle at 76% 35%,rgba(184,208,244,.13),transparent 30%),
    linear-gradient(120deg,#1d3454 0%,#263d60 55%,#213858 100%);
}
.hero-mark{
  position:absolute;z-index:0;left:50%;top:50%;
  width:min(58vw,760px);height:min(58vw,760px);
  transform:translate(-42%,-48%) scale(.94);opacity:0;pointer-events:none;
  animation:heroMarkReveal 1.8s cubic-bezier(.2,.7,.2,1) .15s forwards;
}
.hero-mark img{width:100%;height:100%;object-fit:contain;display:block;opacity:.105;filter:brightness(0) invert(1)}
@keyframes heroMarkReveal{
  from{opacity:0;transform:translate(-42%,-48%) scale(.94)}
  to{opacity:1;transform:translate(-42%,-48%) scale(1)}
}

.shooting-star{
  position:absolute;width:clamp(110px,14vw,190px);height:1px;
  left:50%;top:39%;transform:translateX(-155px);opacity:0;
  filter:drop-shadow(0 0 4px rgba(255,255,255,.22));
  animation:starPass 2.4s ease-in-out 1s forwards;z-index:2;pointer-events:none;
}
.shooting-star:before{content:"";position:absolute;right:-4px;top:50%;width:5px;height:5px;transform:translateY(-50%) rotate(45deg);background:rgba(255,255,255,.82);box-shadow:0 0 7px rgba(255,255,255,.42)}
.shooting-star:after{content:"";position:absolute;left:0;top:0;width:100%;height:1px;background:linear-gradient(to left,rgba(255,255,255,.58),rgba(255,255,255,.22) 45%,transparent)}
@keyframes starPass{
  0%{opacity:0;transform:translateX(-155px)}
  18%{opacity:.48}
  58%{opacity:.38;transform:translateX(45px)}
  100%{opacity:0;transform:translateX(85px)}
}

.content{
  position:relative;z-index:3;min-height:100svh;
  display:grid;grid-template-columns:1fr 1fr;gap:7vw;align-items:center;
  padding-top:70px;padding-bottom:55px;
}
.copy{align-self:center}
.eyebrow{margin:0 0 18px;color:var(--accent);font-size:11px;letter-spacing:.28em;font-weight:700}
h1{margin:0;font-size:clamp(58px,8vw,118px);line-height:.9;font-weight:300;letter-spacing:-.04em}
.team{margin:28px 0 0;padding-top:18px;border-top:1px solid var(--line);color:rgba(255,255,255,.72);font-size:11px;letter-spacing:.22em;max-width:600px}
.intro{margin:28px 0 0;max-width:560px;color:var(--muted);font-size:14px;line-height:1.9}
.logo-link{
  display:inline-flex;align-items:center;justify-content:center;
  margin-top:28px;width:min(100%,420px);min-height:110px;
  padding:24px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.045);transition:.3s ease;
}
.logo-link:hover{border-color:rgba(255,255,255,.68);background:rgba(255,255,255,.09);transform:translateY(-2px)}
.logo-link img{width:min(100%,330px);height:auto;display:block}

.project{
  align-self:center;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.055);padding:24px;
}
.project-label{font-size:10px;letter-spacing:.22em;color:var(--accent);margin-bottom:14px}
.project img{width:100%;display:block;max-height:330px;object-fit:contain}
.project h2{font-size:28px;font-weight:400;letter-spacing:.02em;margin:22px 0 10px}
.project p{margin:0;color:var(--muted);font-size:13px;line-height:1.9}
.project-btn{
  display:inline-block;margin-top:20px;padding:12px 16px;
  border:1px solid rgba(255,255,255,.35);font-size:10px;letter-spacing:.15em;font-weight:700;
  transition:.25s ease;
}
.project-btn:hover{background:#fff;color:#172b49}

.bottom{position:absolute;left:0;right:0;bottom:20px;z-index:5}
.bottom-inner{display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.48);font-size:10px;letter-spacing:.16em}
.back:hover{color:#fff}

@media(max-width:900px){
 .wrap{width:calc(100% - 40px)}
 .header{height:72px}.home-logo{width:118px}.nav{gap:20px;font-size:11px}
 .content{grid-template-columns:1fr;gap:28px;padding-top:95px;padding-bottom:75px}
 .copy{order:1}.project{order:2}
 .hero-mark{width:82vw;height:82vw}
}
@media(max-width:520px){
 h1{font-size:62px}.logo-link{min-height:90px}.project{padding:18px}
}
</style>
</head>
<body>
<header class="header">
  <div class="wrap header-inner">
    <a class="home-logo" href="index.html#top" aria-label="CASTOR Home">
      <img src="assets/castor-logo-official-1.png" alt="CASTOR">
    </a>
    <nav class="nav" aria-label="Main navigation">
      <a href="index.html#play">PLAY</a>
      <a href="index.html#create">CREATE</a>
    </nav>
  </div>
</header>

<main class="studio-hero">
  <div class="shooting-star" aria-hidden="true"></div>
  <div class="hero-mark" aria-hidden="true"><img src="assets/castor-mark.png" alt=""></div>

  <div class="wrap content">
    <div class="copy">
      <p class="eyebrow">CASTOR / CREATE</p>
      <h1>KAIRI_studio</h1>
      <p class="team">GAME / WEB / CREATE</p>
      <p class="intro">ゲームやWebなど、「つくってみたい」を形にしていく小さなスタジオ。</p>

      <a class="logo-link" href="https://github.com/KAIRI-studio" target="_blank" rel="noopener noreferrer" aria-label="KAIRI_studio">
        <img src="assets/kairi-studio-logo.png" alt="KAIRI_studio">
      </a>
    </div>

    <article class="project">
      <div class="project-label">PROJECT / GAME / LEARN</div>
      <img src="assets/kanji-quest.png" alt="CASTOR KANJI QUEST">
      <h2>CASTOR KANJI QUEST</h2>
      <p>小学1年生向けの漢字よみれんしゅうゲーム。3択で答えながら、ゲーム感覚で漢字の読みを練習できます。</p>
      <a class="project-btn" href="https://kairi-studio.github.io/kanji-quest/" target="_blank" rel="noopener noreferrer">PLAY KANJI QUEST →</a>
    </article>
  </div>

  <div class="bottom">
    <div class="wrap bottom-inner">
      <a class="back" href="index.html#create">← BACK TO CREATE</a>
      <span>KAIRI_STUDIO / CASTOR</span>
    </div>
  </div>
</main>
</body>
</html>
