<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAIRI_studio | CASTOR</title><link rel="preload" as="image" href="assets/kairi-studio-logo.png"><link rel="preload" as="image" href="assets/kanji-quest-keyvisual.png"><link rel="preload" as="image" href="assets/kanji-quest-play.png"><link rel="preload" as="image" href="assets/kanji-quest-character.png">
<style>
:root{--bg:#263d60;--bg2:#172b49;--muted:rgba(255,255,255,.68);--line:rgba(255,255,255,.18);--accent:#b9d2f4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg2);color:#fff}body{font-family:Arial,"Helvetica Neue",sans-serif;overflow-x:hidden}a{text-decoration:none;color:inherit}.wrap{width:calc(100% - 140px);max-width:1500px;margin:auto}
.header{position:fixed;top:0;left:0;right:0;z-index:50;height:86px;display:flex;align-items:center}.header-inner{display:flex;align-items:center;justify-content:space-between}.home-logo{display:block;width:150px}.home-logo img{display:block;width:100%;filter:brightness(0) invert(1)}.nav{display:flex;gap:42px;font-size:13px;letter-spacing:.14em;font-weight:700}.nav a{position:relative;padding:10px 0;color:rgba(255,255,255,.82)}.nav a:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:#fff;transform:scaleX(0);transform-origin:right;transition:.3s}.nav a:hover:after{transform:scaleX(1);transform-origin:left}
.studio-hero{position:relative;isolation:isolate;-webkit-transform:translateZ(0);transform:translateZ(0);min-height:100svh;overflow:hidden;background:radial-gradient(circle at 76% 35%,rgba(184,208,244,.13),transparent 30%),linear-gradient(120deg,#1d3454 0%,#263d60 55%,#213858 100%)}
.hero-mark{position:absolute;z-index:0;left:50%;top:50%;width:min(58vw,760px);height:min(58vw,760px);transform:translate(-42%,-48%);pointer-events:none;contain:paint}.hero-mark img{display:block;width:100%;height:100%;object-fit:contain;opacity:0;filter:brightness(0) invert(1);transform:scale(.94);animation:heroMarkImgReveal 1.8s cubic-bezier(.2,.7,.2,1) .15s forwards;will-change:opacity,transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}@keyframes heroMarkImgReveal{from{opacity:0;transform:scale(.94)}to{opacity:.105;transform:scale(1)}}
.shooting-star{position:absolute;width:clamp(110px,14vw,190px);height:1px;left:50%;top:39%;transform:translateX(-155px);opacity:0;filter:drop-shadow(0 0 4px rgba(255,255,255,.22));animation:starPass 2.4s ease-in-out 1s forwards;z-index:2;pointer-events:none}.shooting-star:before{content:"";position:absolute;right:-4px;top:50%;width:5px;height:5px;transform:translateY(-50%) rotate(45deg);background:rgba(255,255,255,.82);box-shadow:0 0 7px rgba(255,255,255,.42)}.shooting-star:after{content:"";position:absolute;left:0;top:0;width:100%;height:1px;background:linear-gradient(to left,rgba(255,255,255,.58),rgba(255,255,255,.22) 45%,transparent)}@keyframes starPass{0%{opacity:0;transform:translateX(-155px)}18%{opacity:.48}58%{opacity:.38;transform:translateX(45px)}100%{opacity:0;transform:translateX(85px)}}
.content{position:relative;z-index:3;isolation:isolate;-webkit-transform:translateZ(0);transform:translateZ(0);min-height:100svh;display:grid;grid-template-columns:1fr 1.12fr;gap:6vw;align-items:center;padding-top:70px;padding-bottom:55px}.copy{align-self:center}.eyebrow{margin:0 0 18px;color:var(--accent);font-size:11px;letter-spacing:.28em;font-weight:700}h1{margin:0;font-size:clamp(58px,8vw,118px);line-height:.9;font-weight:300;letter-spacing:-.04em}.team{margin:28px 0 0;padding-top:18px;border-top:1px solid var(--line);color:rgba(255,255,255,.72);font-size:11px;letter-spacing:.22em}.intro{margin:28px 0 0;max-width:560px;color:var(--muted);font-size:14px;line-height:1.9}
.logo-card{display:flex;align-items:center;justify-content:center;margin-top:28px;width:min(100%,420px);height:190px;padding:28px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.045);overflow:hidden;transition:none!important;transform:none!important}.logo-card img{display:block;width:230px;max-width:72%;height:auto;max-height:135px;object-fit:contain;margin:0 auto;flex:0 0 auto;opacity:1;visibility:visible}
.project{align-self:center;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.055);padding:24px;min-width:0;overflow:hidden}.project-label{font-size:10px;letter-spacing:.22em;color:var(--accent);margin-bottom:14px}.project-showcase{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}.project-key{position:relative;min-width:0;border:1px solid rgba(255,255,255,.14);background:#071522;overflow:hidden}.project-key img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;object-position:center}.project-key:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 55px rgba(5,18,31,.24);pointer-events:none}.project-side{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:none;gap:12px;min-width:0}.project-thumb{border:1px solid rgba(255,255,255,.14);background:#071522;overflow:hidden;min-height:0;display:flex;align-items:flex-start;justify-content:center}.project-thumb img{display:block;width:100%;height:auto;object-fit:contain;object-position:top center}.project h2{font-size:28px;font-weight:400;margin:18px 0 10px}.project p{margin:0;color:var(--muted);font-size:13px;line-height:1.9}.project-btn{display:inline-block;margin-top:18px;padding:12px 16px;border:1px solid rgba(255,255,255,.35);font-size:10px;letter-spacing:.15em;font-weight:700;transition:.25s}.project-btn:hover{background:#fff;color:#172b49}
.bottom{position:absolute;left:0;right:0;bottom:20px;z-index:5}.bottom-inner{display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.48);font-size:10px;letter-spacing:.16em}.back:hover{color:#fff}
@media(max-width:900px){.wrap{width:calc(100% - 40px)}.header{height:72px}.home-logo{width:118px}.nav{gap:20px;font-size:11px}.content{grid-template-columns:1fr;gap:28px;padding-top:95px;padding-bottom:75px}.copy{order:1}.project{order:2}.hero-mark{width:82vw;height:82vw}.project-key img{min-height:360px}}
@media(max-width:520px){
  html,body{width:100%;min-height:100%;}
  .studio-hero{min-height:100svh;height:auto;overflow:hidden;}
  .content{display:flex;flex-direction:column;align-items:stretch;gap:28px;min-height:0;padding-top:94px;padding-bottom:82px;}
  .copy,.project{width:100%;}
  .copy{align-self:stretch;}
  h1{font-size:62px;}
  .logo-card{width:100%;height:190px;margin-top:24px;padding:28px;background:rgba(255,255,255,.045)!important;border:1px solid rgba(255,255,255,.18);overflow:hidden;transition:none!important;transform:none!important}.logo-card img{width:220px;max-width:72%;max-height:130px;object-fit:contain;display:block;opacity:1!important;visibility:visible!important}
  .project{padding:18px;min-height:0;align-self:stretch;background:rgba(255,255,255,.055);overflow:hidden}
  .project-showcase{grid-template-columns:1fr;gap:10px}
  .project-key img{height:auto;min-height:0;aspect-ratio:16/9;object-fit:contain}
  .project-side{grid-template-columns:1fr 1fr;grid-template-rows:none;gap:8px}
  .project-thumb{aspect-ratio:auto}
  .project-thumb img{height:auto;object-fit:contain}
  .project h2{font-size:24px;margin-top:16px;}
  .project p{font-size:12px;line-height:1.8;}
  .project-btn{margin-top:14px;}
  .hero-mark{width:86vw;height:86vw;transform:translate(-42%,-48%) scale(.94);}
  .shooting-star{top:38%;}
}
@media(max-width:380px){
  .wrap{width:calc(100% - 28px);}
  .header{height:64px;}
  .home-logo{width:104px;}
  .nav{gap:15px;font-size:10px;}
  .content{padding-top:82px;}
  h1{font-size:52px;}

  .project{padding:14px;}
}
.logo-card img,.project-key img,.project-thumb img{background:transparent!important;} .logo-card{background-color:rgba(255,255,255,.045)!important;} @media (prefers-reduced-motion:reduce){.hero-mark img,.shooting-star{animation:none!important}.hero-mark img{opacity:.105!important;transform:scale(1)!important}.shooting-star{opacity:0!important}} 
/* Shared CASTOR ambient ripple */
.studio-hero::after{
  content:"";
  position:absolute;
  left:68%;
  top:48%;
  width:18vw;
  height:18vw;
  max-width:300px;
  max-height:300px;
  border:1.5px solid rgba(190,216,248,.085);
  border-radius:50%;
  transform:translate(-50%,-50%) scale(.35);
  opacity:0;
  pointer-events:none;
  animation:studioRipple 9s ease-out 2.6s infinite;
  z-index:1;
}
@keyframes studioRipple{
  0%{transform:translate(-50%,-50%) scale(.35);opacity:0}
  12%{opacity:.8}
  75%{opacity:.18}
  100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}
}
@media(max-width:700px){
  .studio-hero::after{left:72%;top:42%;width:30vw;height:30vw}
}

/* CASTOR KAIRI_studio title motion: right -> left */
h1{
  opacity:0;
  transform:translate3d(70px,0,0);
  animation:studioTitleIn 1.15s cubic-bezier(.2,.7,.2,1) .65s forwards;
}
@keyframes studioTitleIn{
  from{opacity:0;transform:translate3d(70px,0,0)}
  to{opacity:1;transform:translate3d(0,0,0)}
}
@media(prefers-reduced-motion:reduce){
  h1{opacity:1;transform:none;animation:none}
}

</style></head>
<body><header class="header"><div class="wrap header-inner"><a class="home-logo" href="index.html#top"><img src="assets/castor-logo-official-1.png" alt="CASTOR"></a><nav class="nav"><a href="index.html#play">PLAY</a><a href="index.html#create">CREATE</a></nav></div></header>
<main class="studio-hero"><div class="shooting-star" aria-hidden="true"></div><div class="hero-mark" aria-hidden="true"><img src="assets/castor-mark.png" alt=""></div>
<div class="wrap content"><div class="copy"><p class="eyebrow">CASTOR / CREATE</p><h1>KAIRI_studio</h1><p class="team">GAME / WEB / CREATE</p><p class="intro">ゲームやWebなど、「つくってみたい」を形にしていく小さなスタジオ。</p><div class="logo-card"><img src="assets/kairi-studio-logo.png" alt="KAIRI_studio"></div></div>
<article class="project"><div class="project-label">PROJECT / GAME / LEARN</div><div class="project-showcase"><div class="project-key"><img src="assets/kanji-quest-keyvisual.png" alt="CASTOR KANJI QUEST キービジュアル"></div><div class="project-side"><div class="project-thumb"><img src="assets/kanji-quest-play.png" alt="CASTOR KANJI QUEST プレイ画面"></div><div class="project-thumb"><img src="assets/kanji-quest-character.png" alt="CASTOR KANJI QUEST キャラクター選択画面"></div></div></div><h2>CASTOR KANJI QUEST</h2><p>小学生向けの漢字よみれんしゅうゲーム。3択で答えながら、ゲーム感覚で漢字の読みを練習できます。</p><a class="project-btn" href="https://kairi-studio.github.io/kanji-quest/" target="_blank" rel="noopener noreferrer">PLAY KANJI QUEST →</a></article></div>
<div class="bottom"><div class="wrap bottom-inner"><a class="back" href="index.html#create">← BACK TO CREATE</a><span>KAIRI_STUDIO / CASTOR</span></div></div></main></body></html>
