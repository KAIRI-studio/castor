<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>家族端末の登録 | CASTOR</title>
<style>
body {font: 1rem/1.65 system-ui,sans-serif; color:#172b48; background:#edf4ff; margin:0;}
main {max-width:34rem; margin:auto; padding:clamp(1rem,5vw,2.5rem);}
form {background:white; padding:1.25rem; border-radius:1rem;}
select,button {font:inherit; min-height:44px; max-width:100%; margin:.35rem 0;}
label {display:block;}
</style>
<script src="family-device.js" defer></script>
</head>
<body><main>
<h1>家族端末の登録</h1>
<p>普段CASTORを開くブラウザーで設定してください。登録すると、今後のアクセス計測に選んだ区分が付きます。集計から除外中の場合は除外を優先します。</p>
<form id="family">
<label for="slot">このブラウザーの登録先</label>
<select id="slot">
<option value="">未登録</option>
<option value="owner_pc">自分のパソコン</option>
<option value="owner_iphone">自分のiPhone</option>
<option value="son_iphone">息子のiPhone</option>
</select>
<button>保存</button>
<p id="status" role="status"></p>
</form>
<p>同じブラウザーのCASTORと4ゲームに適用されます。ホーム画面に追加したゲームは別の保存領域を使う場合があります。</p>
<p><a href="privacy.html">アクセス計測の設定に戻る</a></p>
</main></body></html>
