<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OFFICIAL STORE | CASTOR</title>
<meta name="description" content="CASTOR OFFICIAL STORE。CASTORのオリジナルアイテムを紹介します。">
<style>
:root{
  --bg:#172b49;
  --text:#fff;
  --muted:rgba(255,255,255,.66);
  --line:rgba(255,255,255,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Helvetica Neue",sans-serif;
}
a{text-decoration:none;color:inherit}

/* Header — same visual language as CASTOR */
.header{
  position:fixed;
  top:0;left:0;right:0;
  z-index:20;
  height:86px;
  display:flex;
  align-items:center;
  background:rgba(19,37,62,.72);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.header-inner{
  width:calc(100% - 140px);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.home-logo{
  display:block;
  width:150px;
  transition:opacity .25s,transform .25s;
}
.home-logo:hover{opacity:.78;transform:translateY(-1px)}
.home-logo img{
  display:block;
  width:100%;
  height:auto;
  filter:brightness(0) invert(1);
}
.back{
  font-size:13px;
  letter-spacing:.14em;
  font-weight:700;
  color:rgba(255,255,255,.82);
  position:relative;
  padding:10px 0;
}
.back:after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:2px;
  height:1px;
  background:#fff;
  transform:scaleX(0);
  transform-origin:right;
  transition:transform .3s;
}
.back:hover:after{
  transform:scaleX(1);
  transform-origin:left;
}

/* Store hero */
.store{
  position:relative;
  min-height:100svh;
  display:flex;
  align-items:center;
  overflow:hidden;
  background:#172b49;
  padding:110px 0 42px;
}
.store-ripple{
  position:absolute;
  left:50%;
  top:52%;
  width:18vw;
  height:18vw;
  max-width:300px;
  max-height:300px;
  border:1.5px solid rgba(190,216,248,.10);
  border-radius:50%;
  transform:translate(-50%,-50%) scale(.35);
  opacity:0;
  pointer-events:none;
  animation:ripple 7s ease-out 1.2s infinite;
}
.store-ripple:nth-child(2){animation-delay:4.7s}

.store-hero{
  display:block;
  position:relative;
  width:100%;
  height:min(78vh,780px);
  min-height:420px;
  overflow:hidden;
  border-top:1px solid rgba(255,255,255,.22);
  border-bottom:1px solid rgba(255,255,255,.22);
  cursor:pointer;
}
.store-enter{
  position:absolute;
  right:28px;
  top:22px;
  z-index:3;
  padding:9px 12px;
  border:1px solid rgba(255,255,255,.42);
  background:rgba(10,24,43,.32);
  color:rgba(255,255,255,.9);
  font-size:9px;
  font-weight:700;
  letter-spacing:.18em;
  backdrop-filter:blur(6px);
}
.store-hero img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  transition:transform .9s cubic-bezier(.2,.7,.2,1),filter .55s ease;
}
.store-hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(8,18,32,0);
  transition:background .55s ease;
  pointer-events:none;
}
.store-caption{
  position:absolute;
  left:28px;
  right:28px;
  bottom:24px;
  z-index:2;
  display:flex;
  align-items:center;
  gap:20px;
  opacity:0;
  transform:translateX(-28px);
  transition:opacity .55s ease,transform .65s cubic-bezier(.2,.7,.2,1);
}
.store-caption span{
  font-size:clamp(24px,3vw,48px);
  font-weight:300;
  letter-spacing:.10em;
  white-space:nowrap;
}
.store-caption i{
  display:block;
  height:1px;
  flex:1;
  max-width:520px;
  background:rgba(255,255,255,.72);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .65s ease .08s;
}
.store-hero:hover img,
.store-hero:focus-visible img{
  filter:grayscale(.55) brightness(.72);
  transform:scale(1.018);
}
.store-hero:hover::after,
.store-hero:focus-visible::after{
  background:rgba(8,18,32,.16);
}
.store-hero:hover .store-caption,
.store-hero:focus-visible .store-caption{
  opacity:1;
  transform:translateX(0);
}
.store-hero:hover .store-caption i,
.store-hero:focus-visible .store-caption i{
  transform:scaleX(1);
}

.store-label{
  position:absolute;
  top:22px;
  left:28px;
  z-index:2;
  font-size:10px;
  letter-spacing:.28em;
  color:rgba(255,255,255,.72);
}

@keyframes ripple{
  0%{transform:translate(-50%,-50%) scale(.35);opacity:0}
  12%{opacity:.8}
  75%{opacity:.18}
  100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}
}

@media(max-width:700px){
  .header{height:72px}
  .header-inner{width:calc(100% - 34px)}
  .home-logo{width:118px}
  .back{font-size:11px}
  .store{padding:88px 0 24px}
  .store-hero{
    height:calc(100svh - 112px);
    min-height:420px;
  }
  .store-hero img{object-position:center}
  .store-caption{
    left:18px;
    right:18px;
    bottom:18px;
    gap:12px;
  }
  .store-caption span{
    font-size:20px;
    letter-spacing:.08em;
  }
  .store-caption i{max-width:none}
  .store-label{
    top:16px;
    left:18px;
    font-size:9px;
  }
  .store-enter{top:auto;right:18px;bottom:18px;font-size:9px;background:rgba(10,24,43,.58)}
  .store-ripple{
    width:30vw;
    height:30vw;
  }
}

@media(prefers-reduced-motion:reduce){
  .store-ripple{animation:none}
  .store-hero img,.store-hero::after,.store-caption,.store-caption i{
    transition:none;
  }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a class="home-logo" href="index.html" aria-label="CASTOR Home">
      <img src="assets/castor-logo-official-1.png" alt="CASTOR">
    </a>
    <a class="back" href="index.html">BACK TO CASTOR</a>
  </div>
</header>

<main class="store">
  <div class="store-ripple" aria-hidden="true"></div>
  <div class="store-ripple" aria-hidden="true"></div>

  <a class="store-hero" href="https://73matibeaver.base.shop/" target="_blank" rel="noopener noreferrer" aria-label="CASTOR Official Storeを開く">
    <span class="store-label">CASTOR / OFFICIAL STORE</span>
    <span class="store-enter">ENTER STORE →</span>
    <img src="assets/official-store.webp" alt="海辺に置かれたCASTORのアイテム">
    <div class="store-caption" aria-hidden="true">
      <span>OFFICIAL STORE</span>
      <i></i>
    </div>
  </a>
</main>

</body>
</html>
